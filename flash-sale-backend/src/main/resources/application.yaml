spring:
  application:
    name: flash-sale-backend
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/${POSTGRES_DB:flashsale}
    username: ${POSTGRES_USER:flashsale}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  config:
    import: optional:file:../.env[.properties]