version: 2

updates:
  - package-ecosystem: maven
    directory: /flash-sale-backend
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "chore"
      - "backend"

  - package-ecosystem: npm
    directory: /flash-sale-frontend
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "chore"
      - "frontend"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "chore"
      - "tooling"
