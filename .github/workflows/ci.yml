name: Continuous Integration

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Maven Verify
        working-directory: flash-sale-backend
        run: ./mvnw verify
